<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="ppBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="ppPulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="ppLeafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#6EE7B7" />
    </linearGradient>
    <filter id="ppGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Icon Base -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="#0F172A" stroke="#1E293B" stroke-width="3" />
  <rect x="10" y="10" width="100" height="100" rx="24" fill="url(#ppBgGrad)" fill-opacity="0.15" />

  <!-- Market Scale Balance Central Pillar -->
  <path d="M60 28 V76" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" />
  <path d="M50 78 H70" stroke="#94A3B8" stroke-width="3.5" stroke-linecap="round" />
  <circle cx="60" cy="26" r="3.5" fill="#FCD34D" />

  <!-- Scale Crossbar -->
  <path d="M34 38 L60 33 L86 38" stroke="#CBD5E1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Scale Hanging Pans -->
  <path d="M34 38 L26 54 H42 Z" fill="#10B981" fill-opacity="0.25" stroke="#34D399" stroke-width="2" stroke-linejoin="round" />
  <path d="M86 38 L78 54 H94 Z" fill="#F59E0B" fill-opacity="0.25" stroke="#FBBF24" stroke-width="2" stroke-linejoin="round" />

  <!-- Organic Agricultural Leaf Motif (Integrated Top-Right) -->
  <path d="M60 26 C68 16 84 18 86 30 C76 33 66 31 60 26 Z" fill="url(#ppLeafGrad)" />
  <path d="M63 26 C72 23 80 25 84 29" stroke="#064E3B" stroke-width="1.2" stroke-linecap="round" />

  <!-- Dynamic Market Pulse Line Wave across foreground -->
  <path d="M16 66 H36 L43 54 L52 74 L60 48 L68 70 L76 58 L82 66 H104" 
        stroke="url(#ppPulseGrad)" 
        stroke-width="4" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#ppGlow)" />

  <!-- Active Realtime Data Node Dot -->
  <circle cx="60" cy="48" r="4.5" fill="#FCD34D" stroke="#0F172A" stroke-width="1.5" />
  <circle cx="60" cy="48" r="7" stroke="#FCD34D" stroke-width="1" stroke-opacity="0.5" />
</svg>
