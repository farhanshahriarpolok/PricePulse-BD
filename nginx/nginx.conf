# PricePulse BD — Production Nginx Configuration
# Includes Phase 5D.3: Rate Limiting for Viva Simulation Shock Injection

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression for React 18 production bundle assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # =========================================================================
    # Phase 5D.3: Rate Limiting Zone for Simulation Shock Injection
    # Zone: 10MB memory stores ~160,000 distinct binary client IPs
    # Rate: 5 requests per second (5r/s) strictly protecting compute-heavy
    #       hypothetical supply shock calculations against denial-of-service.
    # =========================================================================
    limit_req_zone $binary_remote_addr zone=simulation_shock_limit:10m rate=5r/s;

    # Upstream definition for PricePulse BD ASGI service
    upstream pricepulse_backend {
        server 127.0.0.1:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name pricepulse.bd localhost;
        client_max_body_size 20M;

        # ---------------------------------------------------------------------
        # 1. Protected Route: Simulation Shock Injection (Phase 5D.3)
        #    Strictly limited to 5 req/sec with burst=10 nodelay for interactive UI.
        #    Returns HTTP 429 Too Many Requests upon rate limit exhaustion.
        # ---------------------------------------------------------------------
        location = /api/v1/simulation/inject-shock {
            limit_req zone=simulation_shock_limit burst=10 nodelay;
            limit_req_status 429;

            proxy_pass http://pricepulse_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 90s;
        }

        # ---------------------------------------------------------------------
        # 2. General Application and REST API Pass-Through (Unthrottled)
        # ---------------------------------------------------------------------
        location / {
            proxy_pass http://pricepulse_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 90s;
        }
    }
}
