<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="520" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="480" y="40" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" text-anchor="middle" letter-spacing="1">
    PricePulse BD — Tiered End-to-End System Architecture
  </text>
  <text x="480" y="62" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">
    Multi-Source Ingestion, Explainable Analytics Engine, Spatial Arbitrage &amp; Dual Client Ecosystem
  </text>

  <!-- Layer 1: Ingestion Sources -->
  <g transform="translate(40, 90)">
    <rect width="260" height="380" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="260" height="42" rx="14" fill="#1e293b"/>
    <text x="130" y="26" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">
      1. MULTI-SOURCE HARVESTERS
    </text>

    <!-- Source Boxes -->
    <g transform="translate(18, 55)">
      <rect width="224" height="60" rx="8" fill="#1e293b" stroke="#0ea5e9" stroke-width="1.2"/>
      <text x="14" y="24" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="600">DAM Live Harvester</text>
      <text x="14" y="44" fill="#94a3b8" font-family="sans-serif" font-size="10">Dept. Agricultural Marketing (Gov)</text>
      <circle cx="204" cy="22" r="5" fill="#10b981"/>
    </g>

    <g transform="translate(18, 125)">
      <rect width="224" height="60" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.2"/>
      <text x="14" y="24" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="600">TCB Daily Bulletins</text>
      <text x="14" y="44" fill="#94a3b8" font-family="sans-serif" font-size="10">Trading Corp of BD (Bengali Parsed)</text>
      <circle cx="204" cy="22" r="5" fill="#10b981"/>
    </g>

    <g transform="translate(18, 195)">
      <rect width="224" height="60" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2"/>
      <text x="14" y="24" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="600">E-Commerce &amp; Retail Catalogs</text>
      <text x="14" y="44" fill="#94a3b8" font-family="sans-serif" font-size="10">Chaldal Online Grocery Hub</text>
      <circle cx="204" cy="22" r="5" fill="#10b981"/>
    </g>

    <g transform="translate(18, 265)">
      <rect width="224" height="60" rx="8" fill="#1e293b" stroke="#ec4899" stroke-width="1.2"/>
      <text x="14" y="24" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="600">Press &amp; Newspaper Extractor</text>
      <text x="14" y="44" fill="#94a3b8" font-family="sans-serif" font-size="10">Regex Market Roundup Scanner</text>
      <circle cx="204" cy="22" r="5" fill="#10b981"/>
    </g>
  </g>

  <!-- Flow Arrow 1 to 2 -->
  <path d="M 300 280 L 350 280" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6 4" fill="none"/>
  <polygon points="350,275 360,280 350,285" fill="#38bdf8"/>

  <!-- Layer 2: Core Processing & Engine -->
  <g transform="translate(360, 90)">
    <rect width="260" height="380" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="260" height="42" rx="14" fill="#1e293b"/>
    <text x="130" y="26" fill="#10b981" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">
      2. ANALYTICS &amp; SPATIAL CORE
    </text>

    <g transform="translate(18, 55)">
      <rect width="224" height="65" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.2"/>
      <text x="14" y="24" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="600">64-District Spatial Hierarchy</text>
      <text x="14" y="42" fill="#94a3b8" font-family="sans-serif" font-size="10">8 Divisions • 64 Districts • 78 Markets</text>
      <text x="14" y="56" fill="#10b981" font-family="sans-serif" font-size="9" font-weight="600">Dispersion Index D(t) &amp; Freight Arbitrage</text>
    </g>

    <g transform="translate(18, 130)">
      <rect width="224" height="65" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="1.2"/>
      <text x="14" y="24" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="600">Anomaly Engine</text>
      <text x="14" y="42" fill="#94a3b8" font-family="sans-serif" font-size="10">Rolling 7/14/30d SMA • Z-Score • CV%</text>
      <text x="14" y="56" fill="#f43f5e" font-family="sans-serif" font-size="9" font-weight="600">Explainable Natural Language Generator</text>
    </g>

    <g transform="translate(18, 205)">
      <rect width="224" height="65" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.2"/>
      <text x="14" y="24" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="600">Simulation Engine</text>
      <text x="14" y="42" fill="#94a3b8" font-family="sans-serif" font-size="10">Viva Defense Dynamic Stress Sandbox</text>
      <text x="14" y="56" fill="#8b5cf6" font-family="sans-serif" font-size="9" font-weight="600">Synthetic Tariff/Strike Shock Injector</text>
    </g>

    <g transform="translate(18, 280)">
      <rect width="224" height="50" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="14" y="22" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="600">SQLite (WAL Mode) + SQLAlchemy</text>
      <text x="14" y="38" fill="#94a3b8" font-family="sans-serif" font-size="9">Local-First Schema • 100% Non-Destructive</text>
    </g>
  </g>

  <!-- Flow Arrow 2 to 3 -->
  <path d="M 620 280 L 670 280" stroke="#10b981" stroke-width="3" stroke-dasharray="6 4" fill="none"/>
  <polygon points="670,275 680,280 670,285" fill="#10b981"/>

  <!-- Layer 3: Presentation & Dual Clients -->
  <g transform="translate(680, 90)">
    <rect width="240" height="380" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="240" height="42" rx="14" fill="#1e293b"/>
    <text x="120" y="26" fill="#ec4899" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">
      3. CLIENT ECOSYSTEM
    </text>

    <!-- Web Client -->
    <g transform="translate(16, 55)">
      <rect width="208" height="140" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="14" y="24" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="700">Web Client (React 18)</text>
      <text x="14" y="44" fill="#cbd5e1" font-family="sans-serif" font-size="10">• Leaflet 64-District Choropleth</text>
      <text x="14" y="64" fill="#cbd5e1" font-family="sans-serif" font-size="10">• Real-Time Simulation Sandbox</text>
      <text x="14" y="84" fill="#cbd5e1" font-family="sans-serif" font-size="10">• Recharts Dynamic Price Series</text>
      <text x="14" y="104" fill="#cbd5e1" font-family="sans-serif" font-size="10">• Multi-Filter Comparison View</text>
      <text x="14" y="124" fill="#38bdf8" font-family="sans-serif" font-size="9" font-weight="600">Tailwind CSS + Lucide Icons</text>
    </g>

    <!-- Android Client -->
    <g transform="translate(16, 210)">
      <rect width="208" height="145" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.2"/>
      <text x="14" y="24" fill="#10b981" font-family="sans-serif" font-size="12" font-weight="700">Native Android Client</text>
      <text x="14" y="44" fill="#cbd5e1" font-family="sans-serif" font-size="10">• Kotlin + Jetpack Compose</text>
      <text x="14" y="64" fill="#cbd5e1" font-family="sans-serif" font-size="10">• Room Database Offline Cache</text>
      <text x="14" y="84" fill="#cbd5e1" font-family="sans-serif" font-size="10">• Custom Canvas Price Charts</text>
      <text x="14" y="104" fill="#cbd5e1" font-family="sans-serif" font-size="10">• Touch Crosshair Tooltips</text>
      <text x="14" y="124" fill="#10b981" font-family="sans-serif" font-size="9" font-weight="600">Commercial Material 3 UX</text>
    </g>
  </g>
</svg>
